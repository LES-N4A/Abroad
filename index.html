<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abroad v3 - Buy and sell without the risk</title>

<style>
:root{--bg:#F5F8FB;--surface:#fff;--ink:#0B2545;--mute:#5B6B7F;--line:#DCE4EC;--blue:#1D4FA3;--blue-d:#163D80;--tint:#E8F0FC;--red:#D7372F;--ok:#1E8E5A;--gold:#9A6A12;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"DM Sans","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FA8E8;outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
/* header + nav */
header{position:sticky;top:0;z-index:10;background:rgba(245,248,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1280px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--blue);font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.04em;user-select:none}
.logo svg{width:44px;height:34px;overflow:visible}
.logo .trail{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round;opacity:.55}
.logo .pl{color:var(--red)}
nav{display:flex;gap:4px;flex:1}
nav button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:9px 14px;border-radius:99px;color:var(--mute);font-weight:700;cursor:pointer;transition:background .2s,color .2s}
nav button:hover{background:#E9EFF6}nav button.on{background:var(--tint);color:var(--blue)}
.who{display:flex;align-items:center;gap:10px;margin-inline-start:auto;font-weight:700;font-size:14px}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;font-family:var(--display)}
.t0,.a0{background:#D6E4FA;color:#1D4FA3}.t1,.a1{background:#F3E7CF;color:#8A5A12}.t2,.a2{background:#DDF1E6;color:#1E6B46}
.t3,.a3{background:#F9DDDA;color:#A4281F}.t4,.a4{background:#D5EEF1;color:#0F6672}.t5,.a5{background:#E6E0F5;color:#4B3A8F}
.pro{background:#FFF1CC;color:var(--gold);font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-inline-start:6px}
main{max-width:1040px;margin:auto;padding:26px 18px 110px}
#app.enter{animation:fade .2s var(--ease)}@keyframes fade{from{opacity:0}}
h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-.035em;margin:0 0 8px}
h2{font-family:var(--display);font-size:21px;letter-spacing:-.02em;margin:34px 0 12px}
.sub{color:var(--mute);margin:0 0 20px;max-width:56ch}.small{font-size:13px;color:var(--mute)}
/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;padding:12px 22px;border-radius:99px;font-weight:700;cursor:pointer;transition:background .2s,transform .12s;position:relative}
.btn:hover{background:var(--blue-d)}.btn:active{transform:scale(.97)}.btn.full{width:100%}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.alt:hover{background:#EEF3F8}.btn.red{background:var(--red)}
.btn{white-space:nowrap}.btn.sm{padding:9px 16px;font-size:14px}.btn:disabled{opacity:.6;cursor:default}
.btn.busy{color:transparent}.btn.busy::after{content:"";position:absolute;width:18px;height:18px;border:2.5px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.btn.alt.busy::after{border-color:var(--blue);border-right-color:transparent}@keyframes spin{to{transform:rotate(1turn)}}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:5px 0 14px;transition:border .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px var(--tint)}
label{font-size:13px;font-weight:700;color:var(--mute)}
/* shop */
.search{position:relative;margin-bottom:18px}.search .ic{position:absolute;inset-inline-start:14px;top:17px;color:var(--mute);width:20px;height:20px}.search input{padding-inline-start:44px;margin:0;border-radius:99px;height:50px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s var(--ease),border-color .2s}
.item:hover{transform:translateY(-3px);border-color:#B9C9DC}
.tile{height:132px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.05em}
.item .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}.item h3{margin:0;font-size:16px}
.price{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;margin-top:8px}
.seller{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}.seller .av{width:22px;height:22px;font-size:11px}
.item .btn{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0;font-size:15px}.row.t{font-weight:800;border-top:1px solid var(--line);padding-top:11px;font-family:var(--display);font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trip{display:flex;flex-direction:column;gap:2px}.trip .route{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.trip .route .ic{color:var(--red);transform:rotate(90deg);width:20px}
.kg{font-family:var(--display);font-weight:800;font-size:26px;margin-top:10px;letter-spacing:-.03em}
.bar2{height:8px;border-radius:9px;background:#E6ECF3;overflow:hidden;margin:6px 0 12px}.bar2 i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .8s var(--ease)}
.empty{text-align:center;color:var(--mute);padding:48px 12px}.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:19px;margin-bottom:4px}.empty .btn{margin-top:14px}
/* welcome */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:30px 0}
.hero .card{max-width:400px;margin-top:22px;box-shadow:0 18px 40px -22px rgba(29,79,163,.45)}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:10px}}
/* ticket (order) */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px;margin-bottom:16px;box-shadow:0 14px 30px -24px rgba(29,79,163,.55)}
.ticket .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ticket h3{margin:0;font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.pill{padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#EEF2F6;color:var(--mute);white-space:nowrap}
.pill.FUNDED,.pill.SHIPPED{background:var(--tint);color:var(--blue)}.pill.RELEASED{background:#DDF3E7;color:var(--ok)}.pill.DISPUTED,.pill.REFUNDED{background:#FCE3E1;color:var(--red)}
.track{position:relative;height:30px;margin:26px 14px 30px}
.rail{position:absolute;top:13px;left:0;right:0;height:0;border-top:3px dotted #C3D0DE}
.rail i{position:absolute;left:0;top:-3px;height:3px;background:var(--blue);border-radius:3px;width:0;transition:width 1.1s var(--ease)}
.stop{position:absolute;top:8px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#fff;border:3px solid #C3D0DE;transition:all .4s .3s}
.stop.on{border-color:var(--blue);background:var(--blue)}
.jet{position:absolute;top:0;left:0;width:28px;height:28px;margin-left:-14px;color:var(--red);transform:rotate(90deg);transition:left 1.1s var(--ease);filter:drop-shadow(0 3px 2px rgba(215,55,47,.25))}
.lbls{position:absolute;top:30px;left:-14px;right:-14px;display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}.lbls .on{color:var(--ink);font-weight:700}
.perf{position:relative;border-top:2px dashed var(--line);margin:4px -20px 16px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-11px;clip-path:inset(0 0 0 50%)}.perf::after{right:-11px;clip-path:inset(0 50% 0 0)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.amount{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.acts input{margin:0;width:170px;border-radius:99px}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tint);border-radius:16px;padding:12px 16px;margin:0 0 16px}
.code b{font-family:var(--display);font-size:30px;letter-spacing:.22em;color:var(--blue)}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;cursor:pointer;color:#CBD5E0;padding:2px;transition:color .15s,transform .15s}.stars button:hover,.stars button:hover~button{color:#CBD5E0}
.stars:hover button{color:#F2A900}.stars button:hover~button{color:#CBD5E0!important}.stars button:hover{transform:scale(1.15)}.stars .ic{width:28px;height:28px;fill:currentColor}
.note{background:#FCE9E7;color:#8F2119;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
/* modal + toast */
#overlay{position:fixed;inset:0;background:rgba(11,37,69,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30;animation:fade .2s}
#modal{background:#fff;border-radius:24px;padding:24px;max-width:440px;width:100%;max-height:90vh;overflow:auto;animation:pop .28s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
#modal h3{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin:0 0 8px}
@media(max-width:600px){#overlay{align-items:flex-end;padding:0}#modal{border-radius:26px 26px 0 0;animation:sheet .3s var(--ease);padding-bottom:calc(24px + env(safe-area-inset-bottom))}@keyframes sheet{from{transform:translateY(100%)}}}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:40;max-width:92%;font-weight:500;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--red)}
/* phone: bottom tab bar */
@media(max-width:860px){
 header{backdrop-filter:none;background:var(--bg)}
 nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:12}
 nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;border-radius:14px}.who span.nm{display:none}
 #toast{bottom:96px}}
.seg{display:flex;background:#E6ECF3;border-radius:99px;padding:3px}.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer;transition:all .25s var(--ease)}.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(11,37,69,.15)}
.pick{max-width:860px;margin:30px auto 0}.pick h1{max-width:20ch}.pickgrid{gap:18px;margin-top:8px}
.role{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.role:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 20px 36px -26px rgba(29,79,163,.6)}.role b{font-family:var(--display);font-size:24px;letter-spacing:-.03em}.role span{color:var(--mute)}
.role .big{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;margin-bottom:10px}.role .big .ic{width:28px;height:28px}
.role.buy .big{background:var(--tint);color:var(--blue)}.role.sell .big{background:#DDF1E6;color:#1E6B46}.role i{font-style:normal;font-weight:700;color:var(--blue);margin-top:12px}.role.sell i{color:#1E6B46}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}.stat b{display:block;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin-top:2px}
@media(max-width:860px){.lo span{display:none}.lo{padding:8px 9px}#menubtn{padding:8px 9px;gap:4px}.bar{gap:6px;padding:10px 10px;flex-wrap:wrap;row-gap:6px}.who{justify-content:flex-end}.logo{font-size:19px;gap:0}.logo svg{width:30px}.seg button{padding:5px 8px;font-size:12px}.who .btn{font-size:12px}.who{flex:none}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:14px 12px}.stat b{font-size:19px}.stat .small{font-size:12px}.who .av{display:none}.who{gap:6px}.who .btn{padding:7px 12px}}
html[lang=ar]{--display:"Cairo","Segoe UI",Tahoma,sans-serif;--body:"Cairo","Segoe UI",Tahoma,sans-serif}html[lang=ar] *{letter-spacing:0!important}
.logo,.track,.stars{direction:ltr}[dir=rtl] .trip .route .ic{transform:rotate(-90deg)}
.lo{gap:6px}.lo .ic{width:18px;height:18px}[dir=rtl] .lo .ic{transform:scaleX(-1)}
.menu{position:relative}#menu{display:none;position:absolute;inset-inline-end:0;top:46px;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;z-index:50;box-shadow:0 18px 36px -18px rgba(11,37,69,.45);animation:pop .2s var(--ease)}
#menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500}#menu button:hover{background:#EEF3F8}#menu button.cur{font-weight:800;color:var(--blue);background:var(--tint)}#menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.tools{display:flex;gap:8px;align-items:center}
@media(max-width:860px){.tools{margin-inline-start:auto}.who{order:3;flex:1 1 100%;margin:0}.who:not(.has){display:none}.who .seg{flex:1}.who .seg button{flex:1;padding:7px 10px;font-size:13px}.who .av{display:none}}
nav button{white-space:nowrap}nav{min-width:0}
@media(min-width:861px){.lo span{display:none}.lo{padding:9px 11px}.who .av{display:none}nav button{padding:9px 10px;gap:6px}.bar{gap:10px}}
@media(min-width:861px) and (max-width:1100px){nav button:not(.on) span{display:none}}
@media(min-width:861px) and (max-width:900px){#lcode{display:none}.logo{font-size:21px}.seg button{padding:5px 8px;font-size:12px}nav button{padding:9px}#menubtn{padding:9px 11px}}
@media(min-width:861px){nav.many button:not(.on) span{display:none}}
[hidden]{display:none!important}
.ph{width:100%;height:132px;object-fit:cover;display:block}.ph.sm{width:56px;height:56px;border-radius:14px;flex:none}
.photo{display:grid;place-items:center;height:150px;border:2px dashed #C3D0DE;border-radius:16px;margin:5px 0 14px;cursor:pointer;overflow:hidden;color:var(--mute);font-weight:700;transition:border-color .2s,background .2s}
.photo:hover{border-color:var(--blue);background:var(--tint)}.photo img{width:100%;height:100%;object-fit:cover}.photo span{display:flex;gap:8px;align-items:center}
#modal.wide{max-width:580px}
.itm{border:1px solid var(--line);border-radius:18px;padding:14px 14px 4px;margin-bottom:12px;background:#FBFCFE}.itmh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:10px}.conv{margin:-6px 0 10px;min-height:18px;font-weight:700;color:var(--blue)}
.btn.link{background:none;color:var(--red);padding:2px 6px;font-size:13px}.btn.link:hover{background:#FCE9E7}
details.items{margin:10px 0 0;background:#F5F8FB;border-radius:14px;padding:10px 14px}details.items summary{cursor:pointer;font-weight:700;color:var(--blue)}
.li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px;font-size:14px}.li a{color:var(--blue);font-weight:700;margin-inline-start:8px}
.head .lead{display:flex;gap:12px;align-items:flex-start}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="logo" onclick="go('shop')" aria-label="Abroad home">

function pickPhoto(inp){            // shrink the photo in the browser first, so uploads are small and fast
  const f=inp.files[0]; if(!f) return; const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{ const k=Math.min(1,900/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    PHOTO=c.toDataURL('image/jpeg',.82); $('#prev').src=PHOTO; $('#prev').hidden=false; $('#phtxt').hidden=true; URL.revokeObjectURL(url); };
  img.onerror=()=>toast(t('That file is not an image'),true); img.src=url;

async function api(path, method='GET', body){
  const r = await fetch('/api'+path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : 'Check the information and try again');
  return d;
}

async function run(fn){
  const ev=window.event, b=ev&&ev.target&&ev.target.closest&&ev.target.closest('button');

  try{ await fn(); }catch(e){ fail(e); } finally{ if(b){ b.classList.remove('busy'); b.disabled=false; } }
}

/* ---------- flight track ---------- */
const STEPS = ['Ordered','Paid','On its way','Delivered'];
function track(id, step){
  const from = SEEN[id] ?? 0, p = i => i*33.333;
  return `<div class="track" data-id="${id}" data-to="${step}"><div class="rail"><i style="width:${p(from)}%"></i></div>
    ${STEPS.map((_,i)=>`<b class="stop ${i<=step?'on':''}" style="left:${p(i)}%"></b>`).join('')}
    <svg class="jet" style="left:${p(from)}%" aria-hidden="true"><use href="#plane"/></svg>
    <div class="lbls">${STEPS.map((l,i)=>`<span class="${i<=step?'on':''}">${t(l)}</span>`).join('')}</div></div>`;
}
function flyPlanes(){
  document.querySelectorAll('.track').forEach(x=>{
    const to=+x.dataset.to; SEEN[x.dataset.id]=to;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ x.querySelector('.jet').style.left=to*33.333+'%'; x.querySelector('.rail i').style.width=to*33.333+'%'; }));
  });
  localStorage.setItem('abroad_seen', JSON.stringify(SEEN));
}

      <label>${t('Item name')}</label><input placeholder="${esc(t('e.g. Nike Air Force 1, size 42'))}" value="${esc(it.name)}" oninput="setItem(${i},'name',this.value)">
      <div class="grid3"><div><label>${t('Price')}</label><input type="number" min="0" step="0.01" value="${esc(it.price)}" dir="ltr" oninput="setItem(${i},'price',this.value)"></div>
        <div><label>${t('Currency')}</label><select onchange="setItem(${i},'currency',this.value)">${CURRENCIES.map(c=>`<option ${c===it.currency?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>${t('Qty')}</label><input type="number" min="1" max="20" value="${it.qty}" dir="ltr" oninput="setItem(${i},'qty',this.value)"></div></div>
      <label>${t('Weight each (kg)')}</label><input type="number" min="0.05" step="0.05" value="${it.weight}" dir="ltr" oninput="setItem(${i},'weight',this.value)">
      <div class="conv" id="cv${i}" dir="ltr"></div></div>`).join('')}</div>
    <button class="btn alt sm" onclick="addItem()">+ ${t('Add another item')}</button>
    <div id="qs" style="margin-top:14px"></div>
    <p class="small">${t(REQ.rates.source==='live'?'Exchange rates: live':'Exchange rates: approximate')} · ${t('The TND price is locked when you place your order.')}</p>
    <button class="btn full" onclick="sendTrip()">${t('Continue to payment')}</button>`, true);
  doQuote();
}
function setItem(i,k,v){ REQ.items[i][k]=v; clearTimeout(REQ.timer); REQ.timer=setTimeout(doQuote,350); }
function addItem(){ REQ.items.push(newItem(REQ.items[REQ.items.length-1].currency)); drawReq(); }
function rmItem(i){ REQ.items.splice(i,1); drawReq(); }
const payloadItems = () => REQ.items.map(it=>({name:it.name,url:it.url,price:parseFloat(it.price),currency:it.currency,qty:parseInt(it.qty)||1,weight_kg:parseFloat(it.weight)}));
async function doQuote(){
  const idx=[], items=[]; payloadItems().forEach((it,i)=>{ if(it.price>0 && it.weight_kg>0){ idx.push(i); items.push({...it,name:it.name||'-'}); } });
  document.querySelectorAll('.conv').forEach(e=>e.textContent=''); if(!items.length) return $('#qs').innerHTML='';
  try{
    const q = await api('/quote/items','POST',{trip_id:REQ.trip.id,items});
    q.items.forEach((l,n)=>{ const e=$('#cv'+idx[n]); if(e) e.textContent=`${l.price} ${l.currency}${l.qty>1?' × '+l.qty:''} ≈ ${money(l.price_tnd)}`; });
    $('#qs').innerHTML=`<div class="row"><span>${t('Items total')}</span><span>${money(q.item_price)}</span></div><div class="row"><span>${t('Total weight')}</span><span dir="ltr">${t('{n} kg',{n:q.weight_kg})}</span></div>
      <div class="row"><span>${t('Traveler reward')}</span><span>${money(q.reward)}</span></div><div class="row"><span>${t('Service fee')}</span><span>${money(q.fee)}</span></div>
      <div class="row t"><span>${t('Total')}</span><span>${money(q.total)}</span></div>`;
  }catch(e){ $('#qs').innerHTML=`<div class="note">${esc(trErr(e.message))}</div>`; }
}
function sendTrip(){ run(async()=>{ const r=await api('/orders/traveler','POST',{buyer_id:user.id,trip_id:REQ.trip.id,items:payloadItems()}); await payModal(r.id); }); }

/* ---------- Orders (boarding-pass tickets) ---------- */
async function orders(){
  const all = await api(`/users/${user.id}/orders`), buyer = role==='buyer';
  const Lst = all.filter(o => buyer ? o.buyer_id===user.id : o.provider_id===user.id);
  show(`<h1>${t(buyer?'My orders':'Sales')}</h1><p class="sub">${t(buyer?'Follow each order, and find your delivery codes here.':"Ship paid orders, then enter the buyer's code at handover to get paid.")}</p>` +
    (Lst.map(orderCard).join('') || `<div class="empty"><b>${t(buyer?'No orders yet':'No sales yet')}</b>${t(buyer?'Your purchases will show up here.':'Paid orders will show up here.')}<br><button class="btn" onclick="${buyer?"go('shop')":"go('sell')"}">${t(buyer?'Browse the shop':'Add a product')}</button></div>`));
  flyPlanes();
}
function copyCode(c){ navigator.clipboard.writeText(c); toast(t('Code copied')); }
function orderCard(o){
  const buyer = o.buyer_id===user.id, step = {CREATED:0,FUNDED:1,SHIPPED:2,RELEASED:3}[o.state];
  let acts = '', info = '', mid = '';
  if(step!==undefined) mid = track(o.id, step);
  else mid = `<div class="note">${t(o.state==='DISPUTED'?'This order is under review. We will decide within 48 hours.':o.state==='REFUNDED'?'This order was refunded to the buyer.':'This order was cancelled.')}</div>`;
  if(buyer && o.state==='CREATED') acts = `<button class="btn sm" onclick="run(()=>payModal(${o.id}))">${t('Pay securely')}</button>`;
  if(buyer && o.code) info = `<div class="code"><div><div class="small">${t('Your delivery code')}</div><b dir="ltr">${o.code}</b><div class="small">${t('Share it only when your order arrives.')}</div></div><button class="btn alt sm" onclick="copyCode('${o.code}')">${t('Copy')}</button></div>`;
  if(!buyer && o.state==='FUNDED') acts = `<button class="btn sm" onclick="act(${o.id},'ship',{provider_id:${user.id}},${q(t('Marked as shipped'))})">${t('Mark as shipped')}</button>`;
  if(!buyer && o.state==='SHIPPED') acts = `<input id="c${o.id}" placeholder="${esc(t("Buyer's 6-digit code"))}" maxlength="6" inputmode="numeric" dir="ltr"><button class="btn sm" onclick="act(${o.id},'confirm',{code:$('#c${o.id}').value},${q(t('Delivery confirmed. Your payout is released.'))})">${t('Confirm delivery')}</button>`;
  if(buyer && o.state==='SHIPPED') acts = `<button class="btn alt sm" onclick="if(confirm(${q(t('Report a problem with this order?'))}))act(${o.id},'dispute',{},${q(t('Problem reported. We are reviewing it.'))})">${t('Report a problem')}</button>`;
  if(buyer && o.state==='RELEASED' && !o.rated) acts = `<div class="small">${esc(t('Rate {n}',{n:o.provider_name}))}</div><div class="stars" dir="ltr">${[1,2,3,4,5].map(n=>`<button aria-label="${n}" onclick="act(${o.id},'rate',{stars:${n}},${q(t('Thanks for rating'))})">${ic('star')}</button>`).join('')}</div>`;
  const who = buyer ? t('Seller {n}',{n:esc(o.provider_name)}) : t('Buyer {n}',{n:esc(o.buyer_name)});
  const list = o.items && o.items.length ? `<details class="items"><summary>${o.items.length===1?t('1 item'):t('{n} items',{n:o.items.length})}</summary>${o.items.map(i=>`<div class="li"><div>${esc(i.name)}${i.qty>1?' ×'+i.qty:''}${i.url.toLowerCase().startsWith('http')?`<a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${t('Open link')}</a>`:''}</div><div class="small" dir="ltr">${i.price} ${i.currency} → ${money(i.price_tnd)}</div></div>`).join('')}</details>` : '';
  const pic = o.has_image ? `<img class="ph sm" src="/api/listings/${o.listing_id}/image" alt="">` : '';
  return `<div class="ticket"><div class="head"><div class="lead">${pic}<div><h3>${esc(o.title)}</h3><div class="small">${t('Order #{n}',{n:o.id})} · ${t(o.kind==='LOCAL'?'Local':'From abroad')} · ${who}</div></div></div><span class="pill ${o.state}">${t(STATUS[o.state])}</span></div>${list}
    ${mid}<div class="perf"></div>${info}
    <div class="foot"><div><div class="small">${t(buyer?'Total paid':'You receive')}</div><div class="amount">${money(buyer?o.total:o.payout)}</div></div><div class="acts">${acts}</div></div></div>`;
}
function act(id, what, body, msg){ run(async()=>{ await api(`/orders/${id}/${what}`,'POST',body); toast(msg); render(); }); }

/* ---------- Admin ---------- */
async function admin(){
  const Lst = await api('/admin/disputes');
  show(`<h1>${t('Disputes')}</h1><p class="sub">${t('Decide who gets the money held in escrow.')}</p>` + (Lst.map(o=>`<div class="ticket"><div class="head"><div><h3>${esc(o.title)}</h3>
    <div class="small">${esc(t('Buyer {b} · Provider {p}',{b:o.buyer_name,p:o.provider_name}))}</div></div><div class="amount">${money(o.total)}</div></div><div class="perf"></div>
    <div class="acts"><button class="btn red sm" onclick="act(${o.id},'resolve',{in_favor_of:'buyer'},${q(t('Buyer refunded'))})">${t('Refund buyer')}</button>
    <button class="btn sm" onclick="act(${o.id},'resolve',{in_favor_of:'provider'},${q(t('Provider paid'))})">${t('Pay provider')}</button></div></div>`).join('') || `<div class="empty"><b>${t('No open disputes')}</b>${t('Everything is running smoothly.')}</div>`));
}

applyLang();
if(user) api('/me/'+user.id).then(u=>{user=u;localStorage.setItem('abroad_user',JSON.stringify(u));render();}).catch(()=>{user=null;render();}); else render();

</script>
</body>
